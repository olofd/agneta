# Builds and tests Agneta on the Macs it supports, with the real engines (docs/CI.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26, Apple silicon
            runner: macos-26
          - name: macOS 15, Apple silicon
            runner: macos-15
          - name: macOS 15, Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "No Xcode 26 on this runner" >&2; exit 1; }
          sudo xcode-select -s "$xcode"
          sw_vers
          swift --version

      # The fake model and tool servers are Python, and on GitHub's runners a server started by some Pythons
      # (/usr/local/bin/python3, measured 2026-11-18 on all three) never accepts a connection on 127.0.0.1, while
      # one from /opt/homebrew/bin/python3 answers at once. Use the first Python whose server answers.
      - name: Pick a Python whose loopback server answers
        run: |
          for python in /opt/homebrew/bin/python3 /usr/local/bin/python3 /usr/bin/python3; do
            [ -x "$python" ] || continue
            "$python" -m http.server 47390 --bind 127.0.0.1 >/dev/null 2>&1 & server=$!
            answered=false
            for _ in $(seq 1 20); do
              if curl -s -o /dev/null -m 1 http://127.0.0.1:47390/; then answered=true; break; fi
              sleep 0.25
            done
            kill $server; wait $server 2>/dev/null || true
            if $answered; then
              echo "AGNETA_TEST_PYTHON=$python" >> "$GITHUB_ENV"
              echo "fake servers run on $python ($("$python" --version))"; exit 0
            fi
            echo "$python: its server on 127.0.0.1 didn't answer"
          done
          echo "::error::No Python here serves on loopback; the integration tests need one"; exit 1

      - name: Fetch the pinned engines
        run: scripts/fetch-engines --engine all

      - name: Build
        run: swift build

      # The real-engine suites (Goose and OpenCode against the fake model, the sandbox acceptance test) must run:
      # AGNETA_REQUIRE_ENGINES turns a missing engine into a failure instead of a skip.
      # Tests keep their folders (fake model and tool server logs, engine logs, traces), uploaded if a test fails.
      - name: Test
        env:
          AGNETA_REQUIRE_ENGINES: "1"
          AGNETA_KEEP_TEST_FILES: "1"
        run: swift test

      # Foundation's temporary folder is the user's Darwin temp folder, whatever TMPDIR says.
      - name: Collect the test folders
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/agneta-tests"
          cp -R "$(getconf DARWIN_USER_TEMP_DIR)"agneta-* "$RUNNER_TEMP/agneta-tests/" 2>/dev/null || true
          du -sh "$RUNNER_TEMP/agneta-tests"

      - name: Upload the test folders
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-folders-${{ matrix.runner }}
          path: ${{ runner.temp }}/agneta-tests/
          retention-days: 7

      - name: Build the app bundle
        run: scripts/dev/build-app

      - name: Test Project Chat
        working-directory: examples/project-chat
        run: |
          node="$GITHUB_WORKSPACE/build/Agneta Dev.app/Contents/MacOS/node"
          "$node" --test test/*.test.mjs test/agneta.smoke.mjs
