# Publishes @agneta/client to npm from a client-v* tag (packages/client/README.md, Releasing). A run by hand is a dry
# run: everything but publishing. npm's trusted publishing authenticates this workflow by OIDC, so no npm token is
# stored anywhere, and --provenance links the published package to this run and commit. The publish job waits in the
# `npm` environment for the maintainer's approval.
name: Client release

on:
  push:
    tags: ['client-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      tarball: ${{ steps.pack.outputs.tarball }}
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "${GITHUB_REF_NAME#client-v}" == "$version" ]] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json's $version"; exit 1; }
            publish=true
          else
            publish=false
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$version isn't major.minor.patch[-pre]"; exit 1; }
          grep -q "^## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no notes for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Releasing @agneta/client $version (publish: $publish) from $(git rev-parse --short HEAD)"

      - name: The commit is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA isn't on main"; exit 1; }

      # ci.yml runs the client against agnetad on macOS, and Project Chat on it: that must have passed on this commit.
      - name: CI passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          [[ "$passed" -gt 0 ]] || { echo "::error::CI hasn't passed on $GITHUB_SHA"; exit 1; }

      - name: Install
        run: npm ci

      - name: Build, type-check and test
        run: |
          npm run build
          npm run typecheck
          npm test

      # The exact tarball tested here is the one published.
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package" | tail -1)
          tar -tzf "$RUNNER_TEMP/package/$tarball" | sort
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-package
          path: ${{ runner.temp }}/package/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    # Waits for the maintainer's approval. npm's trusted publisher for @agneta/client names this workflow and environment.
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-package
          path: package

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Publish
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) can't use trusted publishing"; exit 1; }
          tag=latest; [[ "$VERSION" == *-* ]] && tag=next
          npm publish "package/$TARBALL" --provenance --access public --tag "$tag"
