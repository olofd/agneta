# Builds, type-checks and unit-tests the TypeScript client (clients/typescript) on the Node versions it supports
# (clients/typescript/DESIGN.md). Its integration test against agnetad runs in ci.yml, on macOS, where agnetad is built.
name: TypeScript client

on:
  push:
    branches: [main]
    paths: ['clients/typescript/**', 'clients/swift/Tests/AgnetaClientTests/Fixtures/**', '.github/workflows/client-typescript.yml']
  pull_request:
    paths: ['clients/typescript/**', 'clients/swift/Tests/AgnetaClientTests/Fixtures/**', '.github/workflows/client-typescript.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the package supports (engines in package.json) and the current one.
        node: ['22', '24']
    # The library itself is plain TypeScript with no native parts: Linux tests it as well as a Mac, for less.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Only the lockfile's packages: TypeScript and Node's types (the package has no runtime dependencies).
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The sources, and test/types.test.ts, which checks that the unions narrow and wrong calls don't compile.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package contents
        run: npm pack --dry-run
