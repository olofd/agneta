<!doctype html>
<!-- The repository's social preview, docs/images/social-preview.png (1280 × 640): site/social/render makes it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #151516; color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; align-items: center;
  }
  .text { width: 470px; padding-left: 88px; flex: none; }
  .text img { display: block; width: 116px; height: 116px; margin: 0 0 18px -10px; }
  h1 { font-size: 76px; font-weight: 700; letter-spacing: -0.035em; margin: 0 0 14px; line-height: 1; }
  p { margin: 0; }
  .tagline { text-wrap: balance; font-size: 34px; font-weight: 600; letter-spacing: -0.022em; line-height: 1.2; }
  .meta { margin-top: 28px; font-size: 20px; color: #a1a1a6; letter-spacing: -0.01em; line-height: 1.4; }
  .shots { flex: 1; display: flex; align-items: flex-end; gap: 24px; padding-right: 72px; justify-content: flex-end; }
  .shots img { display: block; border-radius: 14px; box-shadow: 0 2px 4px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.55); }
  .panel { width: 262px; margin-bottom: 22px; }
  .approval { width: 350px; }
</style>
</head>
<body>
  <div class="text">
    <img src="../../packaging/AppIcon.png" alt="">
    <h1>Agneta</h1>
    <p class="tagline">Give Mac apps an AI agent you control.</p>
    <p class="meta">An open-source menu bar app for macOS.<br>Your own plans and keys, sandboxed, in view.</p>
  </div>
  <div class="shots">
    <img class="panel" src="../../docs/images/panel-dark.png" alt="">
    <img class="approval" src="../../docs/images/approval-dark.png" alt="">
  </div>
</body>
</html>
