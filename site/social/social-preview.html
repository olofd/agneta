<!doctype html>
<!-- The repository's social preview, docs/images/social-preview.png (1280 × 640): site/social/render makes it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #151516; color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: space-between;
    padding: 0 96px 0 96px; box-sizing: border-box;
  }
  .text { width: 600px; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
  .brand img { width: 104px; height: 104px; margin-left: -8px; }
  h1 { font-size: 72px; font-weight: 700; letter-spacing: -0.035em; margin: 0; line-height: 1; }
  .tagline { margin: 0; font-size: 56px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance; }
  .meta { margin: 28px 0 0; font-size: 26px; color: #a1a1a6; letter-spacing: -0.012em; }
  .panel { width: 400px; display: block; border-radius: 18px; clip-path: inset(0 0 0 6px round 18px); box-shadow: 0 2px 4px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.55); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../packaging/AppIcon.png" alt=""><h1>Agneta</h1></div>
    <p class="tagline">Give Mac apps an AI agent you control.</p>
    <p class="meta">Open-source menu bar app for macOS</p>
  </div>
  <img class="panel" src="../../docs/images/panel-dark.png" alt="">
</body>
</html>
